[project]
name = "math-mcp"
version = "0.1.0"
description = "Two layers, one server: a SymPy CAS that exposes what a model cannot fake, and a contract graph that catches cross-formula errors the CAS structurally cannot see"
requires-python = ">=3.12"
dependencies = ["sympy>=1.13", "mcp>=1.28,<2"]

[project.optional-dependencies]
numeric = ["numpy>=2.0"]

[dependency-groups]
dev = [
    "hypothesis>=6.130",
    "numpy>=2.0",
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=120 --strict-markers -n 2 --dist loadfile"
markers = [
    "fuzz: deterministic property-based checks over generated inputs",
    "sweep: parameter sweeps over dimensions and memory budgets",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/math_mcp"]
