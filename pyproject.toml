[project]
name = "math-mcp"
version = "0.1.0"
description = "Two layers, one server: a SymPy CAS that exposes what a model cannot fake, and a contract graph that catches cross-formula errors the CAS structurally cannot see"
requires-python = ">=3.12"
dependencies = ["sympy>=1.13", "mcp>=1.28,<2"]

[project.optional-dependencies]
numeric = ["numpy>=2.0"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-timeout>=2.3", "numpy>=2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=120"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/math_mcp"]
